name: Discover official opportunities
on:
  push:
    branches: [main]
    paths:
      - 'collectors/curated_verified.json'
      - 'collectors/publish_curated.py'
      - 'collectors/sources.json'
      - 'collectors/collect.py'
      - 'collectors/relevance.py'
      - 'collectors/ai_extract.py'
      - 'collectors/test_*.py'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-opportunity-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test advertisement filters
        run: python -m unittest discover -s collectors -p 'test_*.py'
      - name: Discover candidates and write pending records
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER_PRIORITY: ${{ vars.AI_PROVIDER_PRIORITY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python collectors/collect.py

      - name: Publish independently reviewed faculty notices
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collectors/publish_curated.py

      - name: Export pending advertisements for transparent public review
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collectors/export_pending.py
      - name: Commit updated public discovery snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pending-opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public pending advertisement snapshot [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
