name: Discover official opportunities
on:
  push:
    branches: [main]
    paths:
      - 'collectors/curated_verified.json'
      - 'collectors/publish_curated.py'
      - 'collectors/sources.json'
      - 'collectors/collect.py'
      - 'collectors/test_*.py'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-opportunity-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test advertisement filters
        run: python -m unittest discover -s collectors -p 'test_*.py'
      - name: Discover candidates and write pending records
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collectors/collect.py

      - name: Publish independently reviewed faculty notices
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collectors/publish_curated.py
